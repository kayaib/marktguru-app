name: Update promotions

on:
  schedule:
    - cron: "0 18 * * *"   # every day at 18:00 UTC (20:00 CEST)
    - cron: "0 12 * * *"   # every day at 12:00 UTC (14:00 CEST) — catches late-listed leaflets
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pillow

      - name: Build index.html with vision scraping
        env:
          AICORE_CLIENT_ID: ${{ secrets.AICORE_CLIENT_ID }}
          AICORE_CLIENT_SECRET: ${{ secrets.AICORE_CLIENT_SECRET }}
          AICORE_DEPLOYMENT_ID: ${{ secrets.AICORE_DEPLOYMENT_ID }}
        run: python build.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/images/ leaflet_offers_cache.json || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update promotions $(date -u +%Y-%m-%dT%H:%M)"
            git push
          fi

