name: Daily vision scrape

on:
  schedule:
    - cron: "0 5 * * *"   # every day at 05:00 UTC (07:00 CEST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: push-to-main
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pillow

      - name: Build index.html with full vision scraping
        env:
          AICORE_CLIENT_ID: ${{ secrets.AICORE_CLIENT_ID }}
          AICORE_CLIENT_SECRET: ${{ secrets.AICORE_CLIENT_SECRET }}
          AICORE_DEPLOYMENT_ID: ${{ secrets.AICORE_DEPLOYMENT_ID }}
        run: python build.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/images/ leaflet_offers_cache.json || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: daily scrape $(date -u +%Y-%m-%dT%H:%M)"
            git fetch origin main
            git rebase origin/main
            git push
          fi
